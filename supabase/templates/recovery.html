<!-- Correo de "¿Olvidaste tu contraseña?" (Supabase Auth, plantilla recovery).
     En producción se carga en el panel: Authentication → Email Templates → Reset password. -->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; color: #18181b;">
  <p style="font-size: 22px; font-weight: bold; color: #2D5F8B; margin: 0 0 16px;">Budi</p>
  <h2 style="font-size: 18px; margin: 0 0 12px;">Recupera tu contraseña</h2>
  <p style="font-size: 15px; line-height: 1.5;">
    Recibimos un pedido para cambiar la contraseña de tu cuenta. Toca el botón para elegir una nueva.
  </p>
  <p style="margin: 24px 0;">
    <a href="{{ .ConfirmationURL }}"
       style="background: #2D5F8B; color: #ffffff; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: bold;">
      Elegir contraseña nueva
    </a>
  </p>
  <p style="font-size: 13px; color: #52525b; line-height: 1.5;">
    El enlace sirve una sola vez y vence en una hora. Si no pediste este cambio, ignora este correo: tu contraseña sigue igual.
  </p>
</div>
