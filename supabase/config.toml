# Gruas App Supabase Configuration

[api]
enabled = true
# Using Supabase defaults (54321+). If Hyper-V reserves this range again
# (check via `netsh interface ipv4 show excludedportrange protocol=tcp`),
# shift to a different free range and update apps/web/.env.local + apps/mobile/.env.
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
# 00113 (POR-02): las invitaciones al equipo vuelven a /invitacion?token=...
additional_redirect_urls = ["https://localhost:3000", "http://localhost:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

# 00113 (POR-02): 2FA con app autenticadora (TOTP), obligatorio para el dueño
# y los administradores de un portal cliente. En el proyecto managed hay que
# habilitarlo igual (Authentication -> Multi-Factor).
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Correo de recuperación en español (el de Supabase venía en inglés). En
# producción se carga a mano en el panel; esto solo rige en local.
[auth.email.template.recovery]
subject = "Recupera tu contraseña de Budi"
content_path = "./supabase/templates/recovery.html"

[auth.sms]
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false

[functions.calculate-distance]
# Solo la llama la app movil desde el flujo de solicitud, siempre con sesion.
# El gateway no alcanza como defensa —da por buena la anon key, que es publica—
# asi que la funcion tambien llama requireUser(). Esto es la otra mitad.
verify_jwt = true

[functions.delete-account]
# La persona borra SU cuenta (migr. 00101). La identidad sale del JWT
# (requireUser), nunca de un parametro: si no, cualquiera borraria a otro.
verify_jwt = true

[functions.get-eta]
# Was false to ease early development; flipped 2026-05-25 to close the
# privacy leak (anyone with a request_id could pull operator coords).
# Authorization is also enforced inside the function via
# requireRequestParticipant.
verify_jwt = true

[functions.import-members]
# La aseguradora no tiene cuenta en la plataforma (su portal es B-17), asi que
# no puede presentar un JWT de Supabase. Se autentica con una clave de API
# propia que el gateway no sabe validar: la valida la funcion contra el hash
# guardado en `insurer_api_keys` (ver el encabezado de import-members/index.ts).
verify_jwt = false
