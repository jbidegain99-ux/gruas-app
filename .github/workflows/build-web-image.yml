name: build-web-image

# Builds apps/web as a Docker image and pushes it to GitHub Container
# Registry. The VPS pulls from there with:
#
#   docker pull ghcr.io/<owner>/budi-web:latest
#
# Triggers:
#   - push to main: tags as :latest + :<short-sha>
#   - manual run via Actions tab: same tagging
#
# Secrets required (Settings -> Secrets and variables -> Actions):
#
#   NEXT_PUBLIC_SUPABASE_URL          baked into client bundle
#   NEXT_PUBLIC_SUPABASE_ANON_KEY     baked into client bundle
#   NEXT_PUBLIC_GOOGLE_MAPS_API_KEY   baked into client bundle (map rendering)
#   NEXT_PUBLIC_SENTRY_DSN            optional, baked into bundle
#   NEXT_PUBLIC_SENTRY_TRACES_RATE    optional
#   SENTRY_AUTH_TOKEN                 optional, for source-map upload
#   SENTRY_ORG                        optional
#   SENTRY_PROJECT                    optional
#
# GITHUB_TOKEN is provided automatically with packages:write permission.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.dockerignore'
      - '.github/workflows/build-web-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/budi-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_TRACES_RATE=${{ secrets.NEXT_PUBLIC_SENTRY_TRACES_RATE }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
