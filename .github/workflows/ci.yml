name: CI

on:
  push:
    branches: [main, claude/*]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  # CASA-04: la base de verdad. Levanta Supabase local con TODAS las
  # migraciones desde cero (lo mismo que una base nueva de producción), corre
  # el ciclo de negocio por la API real de cada rol (qa:cycle: PIN, precio,
  # cobertura, cancelaciones, portal, 2FA...) y los tests SQL de contención
  # (db:test: RLS por rol, soporte, organizaciones, socios, km/MOPT).
  # Un PR que rompe el PIN, el precio o las RLS queda en rojo.
  db-tests:
    runs-on: ubuntu-latest
    env:
      # qa-cycle.mjs llama `npx supabase status`: que no pregunte.
      NPM_CONFIG_YES: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # La misma que en local. Los tipos se generan solo del esquema
          # public (no dependen de la imagen de storage de cada versión).
          version: 2.100.1

      - name: Start Supabase (all migrations + seed)
        # Sin los servicios que los tests no usan: arranca más rápido.
        run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,supavisor

      # El orden importa: algunos tests SQL usan los datos que deja el ciclo.
      - name: Business cycle (qa:cycle)
        run: pnpm qa:cycle

      - name: SQL containment tests (db:test)
        run: pnpm db:test

      - name: Generated DB types are up to date
        # Si una migración cambia el esquema, database.types.ts debe
        # regenerarse en el mismo PR (pnpm db:types:local).
        run: |
          pnpm db:types:local
          git diff --exit-code packages/shared/src/database.types.ts

  build-web:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm build:web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}

  test-e2e:
    runs-on: ubuntu-latest
    needs: build-web
    # Skipped (not failed) when Supabase secrets are absent - see check-secrets
    # below. When they are present, a failing E2E run fails the build.
    steps:
      - uses: actions/checkout@v4

      - name: Check for Supabase credentials
        id: check-secrets
        run: |
          if [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ] || [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::warning::Skipping E2E tests - Supabase credentials not configured"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install pnpm
        if: steps.check-secrets.outputs.skip != 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.check-secrets.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.check-secrets.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        if: steps.check-secrets.outputs.skip != 'true'
        run: pnpm --filter web exec playwright install --with-deps

      - name: Run E2E tests
        if: steps.check-secrets.outputs.skip != 'true'
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Skip E2E notice
        if: steps.check-secrets.outputs.skip == 'true'
        run: echo "E2E tests skipped - configure NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY secrets to enable"
